name: Keep HF Backend Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF backend
        run: |
          curl -s https://jettlink-jetlink.hf.space/api/health > /dev/null
          echo "Pinged successfully"
