name: Keep HF Backend Alive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HF backend
        run: |
          echo "Response from API:"
          curl -sS https://jettlink-jetlink.hf.space/api/health
          echo -e "\nPinged successfully"
